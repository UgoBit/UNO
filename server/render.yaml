# Blueprint Render pour le serveur UNO.
# Utilisable via "New +" > "Blueprint" sur Render après avoir poussé le repo.
services:
  - type: web
    name: uno-server
    runtime: node
    buildCommand: npm install && npm run build -w server
    startCommand: npm run start -w server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
    plan: free
